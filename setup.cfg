[metadata]
name = browseagent
version = 1.0.0
description = BrowseAgent - AI-powered search assistant with privacy-first approach
long_description = file: README.md
long_description_content_type = text/markdown
author = BrowseAgent Team
license = MIT
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10

[options]
packages = find:
python_requires = >=3.8
install_requires =
    fastapi
    python-fasthtml
    langchain==0.2.10
    langchain-community==0.2.10
    langchain-core
    langchain-experimental
    langchain-openai
    langsmith
    sentence-transformers
    litellm
    DDGS
    pydantic
    uvicorn[standard]
    requests
    python-multipart
    python-dotenv

[options.packages.find]
include = browseagent*