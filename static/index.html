<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrowseAgent - AI Research Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <button class="new-thread-btn" onclick="location.reload()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    New Thread
                </button>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    </svg>
                    Home
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="chat-container" id="chat-container">
                <!-- Welcome State -->
                <div class="welcome-state" id="welcome-state">
                    <h1 class="welcome-title">Where knowledge begins</h1>
                    <form id="chat-form" class="search-form">
                        <div class="search-input-wrapper">
                            <textarea id="user-input" placeholder="Ask anything..." rows="1" autofocus></textarea>
                            <button type="submit" id="send-btn" class="send-btn">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M2 21l21-9L2 3v7l15 2-15 2z" />
                                </svg>
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Messages Container -->
                <div class="messages-container" id="messages-container" style="display: none;">
                    <!-- Messages will be inserted here -->
                </div>

                <!-- Input Area (shown after first message) -->
                <div class="input-area" id="input-area" style="display: none;">
                    <form id="chat-form-bottom" class="chat-form-bottom">
                        <div class="input-wrapper-bottom">
                            <textarea id="user-input-bottom" placeholder="Ask a follow-up..." rows="1"></textarea>
                            <button type="submit" class="send-btn-bottom">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M2 21l21-9L2 3v7l15 2-15 2z" />
                                </svg>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
